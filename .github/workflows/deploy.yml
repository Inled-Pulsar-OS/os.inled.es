name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          # The community page syncs errors/ideas/help from the GitHub
          # project at build time. The default GITHUB_TOKEN can read
          # projects/issues of this organization; if it ever lacks
          # access, create a fine-grained PAT with `Projects: Read` and
          # `Issues: Read` on the Inled-Pulsar-OS org and store it as
          # the GITHUB_PROJECT_TOKEN secret.
          GITHUB_TOKEN: ${{ secrets.GITHUB_PROJECT_TOKEN || github.token }}

      - name: Check Cloudflare API token
        id: cloudflare
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set - skipping publish to Cloudflare Pages"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Publish to Cloudflare Pages
        if: steps.cloudflare.outputs.available == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a52219f385f97d9f46f3153ecef16fde
          projectName: os-inled-es
          directory: dist
          gitHubToken: ${{ github.token }}
